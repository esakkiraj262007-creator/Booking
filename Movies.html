<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Showing</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: white;
    }

    h1 {
        text-align: center;
        padding: 20px;
        background-color: #1f1f1f;
        margin: 0;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 30px;
    }

    .movie-card {
        width: 220px;
        background-color: #222;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: transform 0.3s;
    }

    .movie-card:hover {
        transform: scale(1.05);
    }

    .movie-card img {
        width: 100%;
        height: 320px;
        object-fit: cover;
    }

    .movie-name {
        text-align: center;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
    }
</style>

</head>
<body>

<h1>🎬 Movie Showing</h1>

<div class="container">

    <div class="movie-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKr7DwrpkqjGnIeygNzG4cIDmfaQkou3u52w&s" alt="Gilli">
